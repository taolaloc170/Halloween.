<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween 🎃</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>
  <div class="fog fog1"></div>
  <div class="fog fog2"></div>

  <main class="card" id="card">
    <div class="pumpkin">🎃</div>
    <p class="tag">HALLOWEEN NIGHT</p>
    <h1 id="question">Bạn có muốn đón Halloween cùng mình không?</h1>
    <p class="sub" id="sub">Có một bất ngờ nhỏ đang chờ bạn...</p>

    <div class="buttons">
      <button id="yes">Có 🎃</button>
      <button id="no">Không 😈</button>
    </div>
  </main>

  <div class="surprise" id="surprise">
    <div class="moon">🌕</div>
    <div class="ghost">👻</div>
    <p class="tag">HAPPY HALLOWEEN</p>
    <h2>Vậy thì cùng mình đón Halloween nhé! 🎃</h2>
    <p>Chúc bạn có một đêm Halloween thật vui và thật nhiều điều bất ngờ ✨</p>
    <button id="again">Xem lại 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
